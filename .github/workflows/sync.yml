name: sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      run_sync:
        description: "Check this box to run sync manually."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: hansolcal-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name == 'schedule' || inputs.run_sync }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write config from secret
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          printf '%s' "$CONFIG_YAML" > config.yaml

      - name: Run sync
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          LOG=$(mktemp)
          for attempt in 1 2 3; do
            python main.py 2>&1 | tee -a "$LOG"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "sync failed; retrying (${attempt}/3) after 60 seconds"
            sleep 60
          done

          if grep -qE "invalid_grant|invalid_client|RefreshError|Token has been expired or revoked" "$LOG"; then
            echo "auth_failure=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            {
              echo "### Scheduled sync failed after retries"
              echo ""
              echo "The scheduled run was marked successful to avoid GitHub email spam."
              echo "Run this workflow manually with run_sync=true when you want a failing status for debugging."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit 1

      - name: Open issue on auth failure
        if: ${{ steps.sync.outputs.auth_failure == 'true' && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Sync auth failure: Google token needs refresh"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number -q 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "Scheduled sync failed with a Google OAuth auth error (invalid_grant / invalid_client / RefreshError).

          **Action required:** regenerate \`google_token.json\` locally and update the \`GOOGLE_TOKEN_JSON\` repo secret.

              cd ~/HansolCal && source .venv/bin/activate && python get_google_token.py
              gh secret set GOOGLE_TOKEN_JSON --repo \$GITHUB_REPOSITORY < google_token.json

          See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Close this issue once sync is healthy again."
          else
            echo "Open auth-failure issue already exists; skipping."
          fi
